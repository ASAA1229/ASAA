name: ASAA PostgreSQL integration

on:
  push:
    branches: [main, dev, new, fix, test]
    paths:
      - "apps/ap-api/**"
      - "monitoring/performance-budget.json"
      - ".github/workflows/postgres-integration.yml"
  pull_request:
    branches: [new, main, dev]
    paths:
      - "apps/ap-api/**"
      - "monitoring/performance-budget.json"
      - ".github/workflows/postgres-integration.yml"

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
        env:
          POSTGRES_DB: asaa_ap
          POSTGRES_USER: asaa
          POSTGRES_PASSWORD: asaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asaa -d asaa_ap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/ap-api
    env:
      ASAA_AP_ENVIRONMENT: test
      ASAA_AP_DATABASE_URL: postgresql+psycopg://asaa:asaa@localhost:5432/asaa_ap
      ASAA_AP_POSTGRES_TEST_URL: postgresql+psycopg://asaa:asaa@localhost:5432/asaa_ap
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ap-api/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Apply all migrations to PostgreSQL
        run: python -m alembic upgrade head
      - name: Verify PostgreSQL schema revision
        run: python -m alembic current
      - name: Run complete API suite and PostgreSQL integration tests
        run: python -m pytest -q
      - name: Verify PostgreSQL migration downgrade and re-upgrade
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: PostgreSQL load run against provisional performance budget (monitoring/performance-budget.json)
        env:
          ASAA_AP_ENVIRONMENT: test
        run: >
          python scripts/load_test.py --concurrency 20 --duration 20 --workers 2
          --database-url "$ASAA_AP_DATABASE_URL"
          --budget-file ../../monitoring/performance-budget.json --json-out pg-load-result.json
      - name: Upload PostgreSQL load result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-load-result
          path: apps/ap-api/pg-load-result.json
