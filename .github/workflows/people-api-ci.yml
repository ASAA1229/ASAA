name: ASAA API quality checks

on:
  push:
    branches: [main, dev, new, fix, test]
    paths:
      - "apps/ap-api/**"
      - ".github/workflows/people-api-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/ap-api/**"
      - ".github/workflows/people-api-ci.yml"

permissions:
  contents: read

jobs:
  people-and-finance-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ap-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ap-api/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run automated API tests
        run: python -m pytest -q
      - name: Verify migration upgrade and downgrade chain
        env:
          ASAA_AP_DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
