name: ASAA Web CI

on:
  push:
    branches: [main, dev, new, fix, test]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/portal-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/portal-ci.yml"

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
