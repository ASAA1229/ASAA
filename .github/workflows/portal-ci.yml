name: ASAA Web CI

on:
  push:
    branches: [main, dev, new, fix, test]
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "playwright.config.js"
      - "apps/ap-api/**"
      - "playwright.config.js"
      - "apps/ap-api/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vitest.config.js"
      - "eslint.config.js"
      - ".github/workflows/portal-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "playwright.config.js"
      - "apps/ap-api/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vitest.config.js"
      - "eslint.config.js"
      - ".github/workflows/portal-ci.yml"

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exactly from the lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Identity transport policy tests
        run: npm run test:web
      - name: UI component and accessibility (axe) tests
        run: npm run test:ui
      - name: Production build
        run: npm run build

  web-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ap-api/pyproject.toml
      - name: Install API dependencies
        run: python -m pip install -e "apps/ap-api[test]"
      - run: npm ci
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Real-browser E2E and axe (production build via vite preview, live local API)
        env:
          E2E_PYTHON: python
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
