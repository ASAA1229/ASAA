name: ASAA Web CI

on:
  push:
    branches: [main, dev, new, fix, test]
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vitest.config.js"
      - "eslint.config.js"
      - ".github/workflows/portal-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vitest.config.js"
      - "eslint.config.js"
      - ".github/workflows/portal-ci.yml"

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exactly from the lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Identity transport policy tests
        run: npm run test:web
      - name: UI component and accessibility (axe) tests
        run: npm run test:ui
      - name: Production build
        run: npm run build

  web-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high
