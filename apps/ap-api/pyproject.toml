[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asaa-ap-api"
version = "0.2.0"
description = "ASAA enterprise API foundations for finance and people operations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "PyJWT[crypto]>=2.9,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0", "jsonschema>=4.20,<5.0", "PyYAML>=6.0,<7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
